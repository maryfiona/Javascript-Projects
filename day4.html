             <H4 style="text-align: center;">DAY 4:DOM Manipulation</H4>
            
      <h3> ONE:Button Color Changer
</h3>
<button id="colorButton">click</button>
<script>
    const button = document.getElementById("colorButton");


    const colors = ["red", "green", "blue", "orange", "purple", "pink", "yellow"];

    button.addEventListener("click", function() {
    
        const randomColor = colors[Math.floor(Math.random() * colors.length)];

        button.style.backgroundColor = randomColor;
    });
</script>
           </section>
           <section>
            <h3>TWO:Live Character Counter</h3>
          

<input type="text" id="textInput" maxlength="50" placeholder="Type something...">
<div id="counter">50 characters remaining</div>

<script>
    const input = document.getElementById("textInput");
    const counter = document.getElementById("counter");
    const maxChars = 50;

    input.addEventListener("input", function() {
        const remaining = maxChars - input.value.length;
        counter.textContent = remaining + " characters remaining";
    });
</script>

           </section>
           <section>
            <h3>THREE:Show/Hide Password</h3>


<input type="password" id="passwordInput" placeholder="Password">
<button id="toggleBtn">Show</button>

<script>
    const passwordInput = document.getElementById("passwordInput");
    const toggleBtn = document.getElementById("toggleBtn");

    toggleBtn.addEventListener("click", function() {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleBtn.textContent = "Hide";
        } else {
            passwordInput.type = "password";
            toggleBtn.textContent = "Show";
        }
    });
</script>
           </section>
        
    </body>
</html>
