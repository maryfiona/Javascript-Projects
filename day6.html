        <h3>DAY 6:Random Quote Generator</h3>
        
        <p id="quote">Click the button to get a quote</p>
        <button id="newQuote">New Quote</button>
        <script>
          const quotes = [
"Believe in yourself.",
"Success comes with consistency.",
"Never stop learning.",
"Hard work beats talent.",
"Stay focused and never quit."
];

const quoteText = document.getElementById("quote");
const   quoteButton = document.getElementById("newQuote");

quoteButton.addEventListener("click", function(){

    const randomIndex = Math.floor(Math.random() * quotes.length);

    quoteText.textContent = quotes[randomIndex];
            });
        </script> 

        <h3>Dice Game</h3>
    
        <p id="result">Click Roll to play</p>
        <button id="rollBtn">Roll Dice</button>
        <script>
            const result = document.getElementById("result");
            document.getElementById("rollBtn").addEventListener("click", function(){
                let player1 = Math.floor(Math.random() * 6) + 1;
                let player2 = Math.floor(Math.random() * 6) +  1;
                 if(player1 > player2){
        result.textContent = "Player 1 wins! 🎉 (" + player1 + " vs " + player2 + ")";
    }
    else if(player2 > player1){
        result.textContent = "Player 2 wins! 🎉 (" + player2 + " vs " + player1 + ")";
    }
    else{
        result.textContent = "It's a draw! 🤝 (" + player1 + " vs " + player2 + ")";
    }

});

        </script>
         <h2>Theme Switcher</h2>

<button id="themeBtn">Toggle Dark Mode</button>

<script>

const button = document.getElementById("themeBtn");

button.addEventListener("click", function(){

    document.body.classList.toggle("dark");

});

</script>
        
    </body>
